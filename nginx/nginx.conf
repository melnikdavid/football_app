server {
    listen 80;
    server_name _;

    # Serve static/media files only — video is served by Vimeo
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Limit access to images/docs only (no video files)
        location ~* \.(mp4|webm|mov|avi)$ {
            return 403;
        }
    }

    # Health check
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # All other traffic goes to Traefik / upstream services
    location / {
        return 404;
    }
}
